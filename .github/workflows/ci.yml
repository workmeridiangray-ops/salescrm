name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - name: Apply migrations to plain Postgres (auth stub stands in for Supabase)
        run: |
          for f in tests/db/auth-stub.sql supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 "$SUPABASE_DB_URL" -q -f "$f"; done
      - run: npm run test:db
      - run: npm run build
